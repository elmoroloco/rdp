name: Windows 11 RDP con ngrok Oficial

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Habilitar Escritorio Remoto (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Configurar contraseña de Administrador
      run: |
        $Password = ConvertTo-SecureString "GitHubRDP123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password

    - name: Iniciar Túnel Ngrok de forma nativa
      uses: ngrok/actions/tunnel@v1
      with:
        protocol: tcp
        port: 3389
        authtoken: "366YyiVvJcxouzvRkdubw0Eb9CD_4KazgGQnhZGhoR9m59b5"

    - name: Mantener el flujo activo y mostrar credenciales
      run: |
        Write-Host "=========================================================="
        Write-Host "CONEXIÓN RDP CONFIGURADA"
        Write-Host "Busca la URL TCP pública en los logs del paso anterior o en tu panel de ngrok."
        Write-Host "Usuario: runneradmin"
        Write-Host "Contraseña: GitHubRDP123!"
        Write-Host "=========================================================="
        
        while ($true) {
            Start-Sleep -Seconds 60
        }
