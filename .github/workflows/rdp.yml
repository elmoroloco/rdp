name: Windows 11 RDP con ngrok (Winget)

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Instalar ngrok vía winget
      run: |
        winget install ngrok.ngrok --accept-source-agreements --accept-package-agreements

    - name: Autenticar ngrok
      run: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        ngrok config add-authtoken "366YyiVvJcxouzvRkdubw0Eb9CD_4KazgGQnhZGhoR9m59b5"

    - name: Habilitar Escritorio Remoto (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Configurar contraseña de Administrador
      run: |
        $Password = ConvertTo-SecureString "GitHubRDP123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password

    - name: Crear Túnel ngrok y Mostrar Credenciales
      run: |
        # Forzar recarga del Path del sistema para localizar ngrok.exe
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        $NgrokPath = Get-Command ngrok | Select-Object -ExpandProperty Source
        
        Write-Host "Iniciando ngrok desde: $NgrokPath"
        
        # Arrancar ngrok guardando los logs directamente en un archivo local
        Start-Process -FilePath $NgrokPath -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log"
        
        Write-Host "Esperando a que ngrok genere la URL pública..."
        $Attempts = 0
        $PublicUrl = $null
        
        # Buscar la URL dentro del archivo de logs durante un máximo de 30 segundos
        while ($null -eq $PublicUrl -and $Attempts -lt 6) {
            Start-Sleep -Seconds 5
            if (Test-Path "ngrok.log") {
                $LogContent = Get-Content "ngrok.log" -Raw
                # Filtrar la URL mediante expresiones regulares (captura tcp://...)
                if ($LogContent -match "url=(tcp://[^\s]+)") {
                    $PublicUrl = $Matches[1]
                }
            }
            $Attempts++
        }

        # Si no se encuentra la URL, mostrar el contenido del log para saber qué ha fallado
        if ($null -eq $PublicUrl) {
            Write-Host "Contenido del log de ngrok:" -ForegroundColor Red
            if (Test-Path "ngrok.log") { Get-Content "ngrok.log" } else { Write-Host "El archivo ngrok.log no se creó." }
            Write-Error "No se pudo obtener la URL pública de ngrok."
            exit 1
        }

        Write-Host "=========================================================="
        Write-Host "CONEXIÓN RDP LISTA"
        Write-Host "Dirección de conexión: $PublicUrl" -ForegroundColor Green
        Write-Host "Usuario: runneradmin"
        Write-Host "Contraseña: GitHubRDP123!"
        Write-Host "=========================================================="
        
    - name: Mantener el flujo activo
      run: |
        while ($true) {
            Start-Sleep -Seconds 60
        }
